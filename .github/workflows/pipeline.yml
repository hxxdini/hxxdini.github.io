name: fundradar-pipeline

on:
  schedule:
    - cron: '7 */4 * * *' # every 4 hours, :07 past (off the hour to dodge GitHub's peak-minute scheduling delays)
  workflow_dispatch: {}

concurrency:
  group: fundradar-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - name: Run ingestion pipeline
        run: node src/pipeline.js
      - name: Generate digest and site
        run: |
          node src/digest.js
          node src/site.js
      - name: Export leads for the applicant finder
        run: npm run export:for-you
      - name: Generate search pages and verify counts
        run: |
          npm run seo
          npm test
      - name: Commit updated data
        run: |
          git config user.name "fundradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data out docs
          git diff --cached --quiet || git commit -m "Pipeline run $(date -u +'%F %H:%M')"
          git pull --rebase -X ours origin main
          git push
      - name: Force a Pages (re)build and confirm it lands
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          # One explicit rebuild request; the push itself also triggers one.
          # Failure here is non-fatal (e.g. an already-in-flight build) — we just need the latest to land.
          gh api -X POST "repos/$repo/pages/builds" >/dev/null || echo "note: rebuild POST returned non-zero, continuing"
          # Poll for up to ~15 minutes. Real builds for this site have taken ~9 min.
          deadline=$(( $(date +%s) + 900 ))
          while [ $(date +%s) -lt $deadline ]; do
            status=$(gh api "repos/$repo/pages/builds/latest" -q .status 2>/dev/null || echo unknown)
            echo "pages status: $status (deadline in $(( deadline - $(date +%s) ))s)"
            case "$status" in
              built) exit 0 ;;
              errored) echo "::error::GitHub Pages build errored"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::GitHub Pages build did not finish within 15 minutes — site may be stale"
          exit 1
      - name: Ping IndexNow (Bing, DuckDuckGo, Yandex) with new pages
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        run: |
          node src/indexnow.js
          git add data/indexnow-sent.json
          git diff --cached --quiet || { git commit -m "IndexNow state $(date -u +'%F %H:%M')" && git pull --rebase -X ours origin main && git push; }
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
        run: node src/notify-telegram.js
